[project]
name = "primecut"
version = "0.1.0"
description = "PrimeCut: podcast in, ranked highlights out. Python package and API."
authors = [
    { name = "Ratnam", email = "111215669+ratnamcodes@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at api/primecut/, not api/src/primecut/.
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
